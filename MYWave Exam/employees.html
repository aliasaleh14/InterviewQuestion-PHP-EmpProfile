<div id="employeeList"></div>

<script>
fetch('/api/employees.php')
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById('employeeList');
    data.forEach(emp => {
      container.innerHTML += `<div><strong>${emp.name}</strong> (${emp.department})</div>`;
    });
  });
</script>
